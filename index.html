<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>កុម្ម៉ង់អាហារ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f6f8; padding: 15px; margin: 0; }
        .card { background: white; border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn { background: #ff4757; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .cart { position: fixed; bottom: 10px; left: 15px; right: 15px; background: #2ed573; color: white; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h2>🍜 ម៉ឺនុយអាហារ</h2>
    <div class="card">
        <div><strong>មីឆាពិសេស</strong><br><span style="color: #666;">$3.00</span></div>
        <button class="btn" onclick="add('មីឆាពិសេស', 3)">+ បន្ថែម</button>
    </div>
    <div class="cart" onclick="order()">🛒 កន្ត្រកទំនិញ (<span id="count">0</span> មុខ)</div>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let cart = [];
        function add(name, price) {
            cart.push({name, price});
            document.getElementById('count').innerText = cart.length;
            tg.HapticFeedback.impactOccurred('medium');
        }
        function order() {
            if(cart.length === 0) { alert("សូមជ្រើសរើសមុខម្ហូប!"); return; }
            tg.sendData(JSON.stringify(cart));
        }
    </script>
</body>
</html>
